<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 92" width="60" height="92" shape-rendering="crispEdges">
    
    <style>
      polygon, path, ellipse { stroke:#1c1c20; stroke-width:0.8; stroke-linejoin:round; }
