<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" shape-rendering="geometricPrecision">
      <defs><filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation=".7" result="blur"/><feFlood flood-color="#ff37d7" flood-opacity=".75"/>
          <feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter></defs>
      <style>
      .wall { fill:#302044; stroke:#20143a; stroke-width:0.9; stroke-linejoin:round; }
      .roof { fill:#45235d; stroke:#20143a; stroke-width:0.9; stroke-linejoin:round; }
      .shade { fill:#160e29; stroke:#20143a; stroke-width:0.9; stroke-linejoin:round; }
      .edge { fill:none; stroke:#20143a; stroke-width:0.9; stroke-linecap:round; stroke-linejoin:round; filter="url(#softGlow)" }
      .trimline { fill:none; stroke:#00efff; stroke-width:.65; stroke-linecap:round; stroke-linejoin:round; }
      .piping { fill:none; stroke:#ff37d7; stroke-width:.8; stroke-linecap:round; stroke-linejoin:round; filter="url(#softGlow)" }
      .window { fill:#39ff90; stroke:#20143a; stroke-width:.55; }
      .door { fill:#160e29; stroke:#20143a; stroke-width:.65; }
      .signframe { fill:#160e29; stroke:#20143a; stroke-width:.7; }
      .line { fill:none; stroke:#ff37d7; stroke-width:.65; stroke-linecap:round; }
      .finish { fill:none; stroke:#00efff; stroke-width:.55; stroke-linecap:round; }
      .extra { fill:none; stroke:#ff37d7; stroke-width:.8; stroke-linecap:round; stroke-linejoin:round; filter="url(#softGlow)" }
      .shine { fill:#ffffff; fill-opacity:.72; stroke:none; }
      .glowdot { fill:#ff37d7; filter:url(#softGlow); }
    </style>
