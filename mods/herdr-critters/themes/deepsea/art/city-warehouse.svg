<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 92" width="60" height="92" shape-rendering="geometricPrecision">
    <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="b"/><feFlood flood-color="#ff8bdf" flood-opacity=".8"/>
      <feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter></defs>
    <style>
      polygon, path, ellipse { stroke:#0b2742; stroke-width:0.8; stroke-linejoin:round; }
      .wall { fill:#5a5fb0; }
      .shade { fill:#3d4178; }
      .roof { fill:#3d3f86; }
      .roofshade { fill:#2c2d60; }
      .metal { fill:#2b84b1; }
      .metalshade { fill:#1d5977; }
      .win { fill:#c5ffff; stroke-width:.45; }
      .windim { fill:#9ac7c7; stroke-width:.45; }
      .door { fill:#282b4f; stroke-width:.5; }
      .ground { fill:#0f2c4c; }
      .lot { fill:#24405a; stroke-width:.5;  }
      .road { fill:#0a2038; stroke:none; }
      .sidel { fill:#0a1f38; }
      .sider { fill:#061526; }
      .grass { fill:#1d5d6a; stroke-width:.5; }
      .water { fill:#041427; stroke-width:.5; }
      .tree { fill:#ff8bdf; stroke-width:.6; }
      .tree2 { fill:#c86ad0; stroke-width:.6; }
      line { stroke-linecap:round; }
      .lane { stroke:#53e4ef; stroke-width:.8; stroke-dasharray:3 3; filter:url(#glow); }
      .rim { stroke:#ff8bdf; stroke-width:.8; filter:url(#glow); }
      .trunk { stroke:#b0507a; stroke-width:1.2; }
      .leg { stroke:#5dcccc; stroke-width:1.4; }
      .fence { stroke:#74ffff; stroke-width:.7; stroke-dasharray:1.5 1.5; fill:none; }
      .edge { stroke:#0b2742; stroke-width:.8; }
      .trimline { stroke:#74ffff; stroke-width:.9; fill:none; }
      .accent { stroke:#ff8bdf; stroke-width:1; fill:none; filter:url(#glow); }
      .crane { fill:#74ffff; stroke-width:.5; }
      .craneshade { fill:#51b2b2; stroke-width:.5; }
      .accentfill { fill:#ff8bdf; stroke-width:.4; filter:url(#glow); }
      .brick { stroke:#071627; stroke-width:.6; }
      .hi { stroke:#53e4ef; stroke-width:.7; fill:none; }
      .winc { fill:#74ffff; stroke-width:.4; filter:url(#glow); }
      .wine { fill:#ff8bdf; stroke-width:.4; filter:url(#glow); }
      .windark { fill:#242646; stroke-width:.4; }
      .neon { stroke:#ff8bdf; stroke-width:.9; fill:none; filter:url(#glow); }
      .neon2 { stroke:#74ffff; stroke-width:.9; fill:none; filter:url(#glow); }
      .holo { fill:#74ffff; fill-opacity:.45; stroke:#74ffff; stroke-width:.5; filter:url(#glow); }
      .glass { fill:#53e4ef; fill-opacity:.13; stroke:#74ffff; stroke-opacity:.75; stroke-width:.8; }
      .glassline { stroke:#ffffff; stroke-opacity:.45; stroke-width:.8; fill:none; }
      .ring { stroke:#74ffff; stroke-width:1.3; fill:none; }
      .fire { stroke:#408c8c; stroke-width:.55; fill:none; }
      .plank { stroke:#36396a; stroke-width:.4; stroke-opacity:.8; }
      .soil { fill:#9a7350; stroke-width:.5; }
      .wheat { stroke:#e6c35c; stroke-width:1.1; }
      .pumpkin { fill:#e8823a; stroke-width:.5; }
      .vine { stroke:#5f8f3e; stroke-width:.9; fill:none; }
      .hay { fill:#e8c870; stroke-width:.5; }
      .rock { fill:#18467a; stroke-width:.5; }
      .sil { fill:#13375f; stroke:#0a1f35; stroke-width:.5; }
      .silside { fill:#0e2a48; stroke:#0a1f35; stroke-width:.5; }
      .siltop { fill:#164272; stroke:#0a1f35; stroke-width:.5; }
      .beam { fill:#efe8d0; fill-opacity:.07; stroke:none; }
      .shaft { fill:#53e4ef; fill-opacity:.05; stroke:none; }
      .fog { fill:#9a978c; fill-opacity:.13; stroke:none; }
      .rut { stroke:#081a2e; stroke-width:.7; }
      .post { stroke:#7a5a3a; stroke-width:1; }
      .rail { stroke:#9a7350; stroke-width:.7; }
    </style>
