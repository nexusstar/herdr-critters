<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="96" height="96" shape-rendering="geometricPrecision">
      <defs><linearGradient id="gelGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#46d9ef" stop-opacity=".88"/><stop offset="1" stop-color="#244a9a" stop-opacity=".84"/>
        </linearGradient><filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation=".7" result="blur"/><feFlood flood-color="#ff8bdf" flood-opacity=".75"/>
          <feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter></defs>
      <style>
      .wall { fill:url(#gelGradient); stroke:#103354; stroke-width:1.15; stroke-linejoin:round; }
      .roof { fill:#17628a; stroke:#103354; stroke-width:1.15; stroke-linejoin:round; }
      .shade { fill:#183d70; stroke:#103354; stroke-width:1.15; stroke-linejoin:round; }
      .edge { fill:none; stroke:#43eaf5; stroke-width:1.15; stroke-linecap:round; stroke-linejoin:round; filter="url(#softGlow)" }
      .trimline { fill:none; stroke:#74ffff; stroke-width:.65; stroke-linecap:round; stroke-linejoin:round; }
      .piping { fill:none; stroke:#ff8bdf; stroke-width:.8; stroke-linecap:round; stroke-linejoin:round; filter="url(#softGlow)" }
      .window { fill:#c5ffff; stroke:#103354; stroke-width:.55; }
      .door { fill:#183d70; stroke:#103354; stroke-width:.65; }
      .signframe { fill:#183d70; stroke:#103354; stroke-width:.7; }
      .line { fill:none; stroke:#53e4ef; stroke-width:.65; stroke-linecap:round; }
      .finish { fill:none; stroke:#74ffff; stroke-width:.55; stroke-linecap:round; }
      .extra { fill:none; stroke:#ff8bdf; stroke-width:.8; stroke-linecap:round; stroke-linejoin:round; filter="url(#softGlow)" }
      .shine { fill:#ffffff; fill-opacity:.72; stroke:none; }
      .glowdot { fill:#ff8bdf; filter:url(#softGlow); }
    </style>
