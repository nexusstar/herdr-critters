      .rock { fill:#ffffe3; stroke-width:.5; }
      .sil { fill:#e7ffb2; stroke:#829563; stroke-width:.5; }
      .silside { fill:#b0ca87; stroke:#829563; stroke-width:.5; }
      .siltop { fill:#ffffd5; stroke:#829563; stroke-width:.5; }
      .beam { fill:#efe8d0; fill-opacity:.07; stroke:none; }
      .shaft { fill:#ffffff; fill-opacity:.05; stroke:none; }
      .fog { fill:#9a978c; fill-opacity:.13; stroke:none; }
      .rut { stroke:#bead8a; stroke-width:.7; }
      .post { stroke:#7a5a3a; stroke-width:1; }
      .rail { stroke:#9a7350; stroke-width:.7; }
