<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 92" width="60" height="92" shape-rendering="geometricPrecision">
    
    <style>
      polygon, path, ellipse { stroke:#624936; stroke-width:0.9; stroke-linejoin:round; }
      .wall { fill:#b8483a; }
      .shade { fill:#7d3127; }
      .roof { fill:#5f5a55; }
      .roofshade { fill:#44413d; }
      .metal { fill:#c89c69; }
      .metalshade { fill:#876947; }
      .win { fill:#f8f2d8; stroke-width:.45; }
