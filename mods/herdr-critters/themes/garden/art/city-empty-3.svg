      .accentfill { fill:#e07aa5; stroke-width:.4; }
      .brick { stroke:#614a32; stroke-width:.6; }
      .hi { stroke:#ffffff; stroke-width:.7; fill:none; }
      .winc { fill:#fff0c9; stroke-width:.4; }
      .wine { fill:#e07aa5; stroke-width:.4; }
      .windark { fill:#4a1d17; stroke-width:.4; }
      .neon { stroke:#e07aa5; stroke-width:.9; fill:none; }
      .neon2 { stroke:#fff0c9; stroke-width:.9; fill:none; }
      .holo { fill:#fff0c9; fill-opacity:.45; stroke:#fff0c9; stroke-width:.5; }
      .glass { fill:#ffffff; fill-opacity:.13; stroke:#fff0c9; stroke-opacity:.75; stroke-width:.8; }
      .glassline { stroke:#ffffff; stroke-opacity:.45; stroke-width:.8; fill:none; }
      .ring { stroke:#fff0c9; stroke-width:1.3; fill:none; }
      .fire { stroke:#8c846f; stroke-width:.55; fill:none; }
      .plank { stroke:#6e2b23; stroke-width:.4; stroke-opacity:.8; }
      .soil { fill:#9a7350; stroke-width:.5; }
      .wheat { stroke:#e6c35c; stroke-width:1.1; }
      .pumpkin { fill:#e8823a; stroke-width:.5; }
      .vine { stroke:#5f8f3e; stroke-width:.9; fill:none; }
