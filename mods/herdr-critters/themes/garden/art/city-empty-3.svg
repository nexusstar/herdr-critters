      .lot { fill:#d8e8b0; stroke-width:.5; stroke-dasharray:1.4 1.2; }
      .road { fill:#e8d3a8; stroke:none; }
      .sidel { fill:#8a6a48; }
      .sider { fill:#6e5236; }
      .grass { fill:#8fbf6a; stroke-width:.5; }
